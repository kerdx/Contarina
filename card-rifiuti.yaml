# Contarina — CARD compatta + popup dettagli
#
# COME USARE: dashboard → Modifica dashboard → Aggiungi scheda → ⋮/icona YAML →
# cancella, incolla questo file, salva.
# Sostituisci ZONA con lo slug del tuo device (es. cornuda →
# sensor.cornuda_raccolta_rifiuti). Trova e sostituisci "ZONA" in questo file.
#
# In dashboard vedi solo bottone + foto bidoni. Tap → popup #contarina-dettaglio
# con Tile, lista, calendario e filtri.
#
# HACS richiesti: bubble-card, auto-entities, template-entity-row
# Icone local:contarina-* da custom_icons/ in www/custom_icons (vedi custom_icons/README.md).
# Fallback senza custom icons: mdi:trash-can, mdi:food-apple, mdi:newspaper,
# mdi:bottle-soda, mdi:leaf.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.ZONA_raccolta_rifiuti
    name: Raccolta rifiuti
    show_state: true
    show_icon: true
    show_name: true
    icon: mdi:trash-can-outline
    tap_action:
      action: navigate
      navigation_path: "#contarina-dettaglio"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#contarina-dettaglio"
    styles: |-
      .bubble-button-card-container {
        border-radius: 20px !important;
      }
  - type: markdown
    content: >
      {% set tipi = state_attr('sensor.ZONA_raccolta_rifiuti', 'tipi_lista') or [] %}
      {% if tipi %}
      <div style="display:flex; gap:10px; justify-content:center; text-align:center;">
        {% if 'secco' in tipi %}
        <div style="flex:1;"><img src="/contarina/contarina-secco.svg" style="width:100%; max-width:90px;"><br><b>Secco</b></div>
        {% endif %}
        {% if 'umido' in tipi %}
        <div style="flex:1;"><img src="/contarina/contarina-umido.svg" style="width:100%; max-width:90px;"><br><b>Umido</b></div>
        {% endif %}
        {% if 'carta' in tipi %}
        <div style="flex:1;"><img src="/contarina/contarina-carta.svg" style="width:100%; max-width:90px;"><br><b>Carta</b></div>
        {% endif %}
        {% if 'vpl' in tipi %}
        <div style="flex:1;"><img src="/contarina/contarina-vpl.svg" style="width:100%; max-width:90px;"><br><b>VPL</b></div>
        {% endif %}
        {% if 'vegetale' in tipi %}
        <div style="flex:1;"><img src="/contarina/contarina-vegetale.svg" style="width:100%; max-width:90px;"><br><b>Vegetale</b></div>
        {% endif %}
      </div>
      {% else %}
      Niente da esporre.
      {% endif %}
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#contarina-dettaglio"
    name: Dettaglio raccolta
    icon: mdi:trash-can-outline
    show_header: true
    card_layout: large
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.ZONA_prossimo_secco
        name: Secco
        color: grey
        icon: local:contarina-secco
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_umido
        name: Umido
        color: amber
        icon: local:contarina-umido
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossima_carta
        name: Carta
        color: yellow
        icon: local:contarina-carta
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_vpl
        name: VPL
        color: blue
        icon: local:contarina-vpl
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_vegetale
        name: Vegetale
        color: green
        icon: local:contarina-vegetale
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossima_raccolta
        name: Prossima raccolta
        color: primary
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
  - type: custom:auto-entities
    card:
      type: entities
      title: Prossime raccolte per frazione
      show_header_toggle: false
    filter:
      include:
        - entity_id: sensor.ZONA_prossimo_secco
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_umido
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossima_carta
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_vpl
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_vegetale
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
      exclude: []
    sort:
      method: state
    show_empty: true
  - type: calendar
    entities:
      - calendar.ZONA_calendario_rifiuti
    initial_view: dayGridMonth
  - type: entities
    title: Filtri e aggiornamento
    show_header_toggle: false
    entities:
      - switch.ZONA_filtro_secco
      - switch.ZONA_filtro_umido
      - switch.ZONA_filtro_carta
      - switch.ZONA_filtro_vpl
      - switch.ZONA_filtro_vegetale
      - button.ZONA_aggiorna_calendario
