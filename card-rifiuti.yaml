# Contarina — CARD singola da aggiungere a una dashboard esistente
#
# COME USARE: dashboard → Modifica dashboard → Aggiungi scheda → ⋮/icona YAML →
# cancella, incolla questo file, salva.
# Sostituisci ZONA con lo slug del tuo device (es. cornuda →
# sensor.cornuda_raccolta_rifiuti). Trova e sostituisci "ZONA" in questo file.
#
# HACS richiesti: bubble-card, auto-entities, template-entity-row
# Icone local:contarina-* da custom_icons/ in www/custom_icons (vedi custom_icons/README.md).
# Fallback senza custom icons: mdi:trash-can, mdi:food-apple, mdi:newspaper,
# mdi:bottle-soda, mdi:leaf.
# Nota: i badge stasera/oggi sono da vista (vedi dashboard-rifiuti.yaml),
# qui dentro non ci stanno — in compenso ci sono i 2 binary sensor nell'entities.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.ZONA_raccolta_rifiuti
    name: Raccolta rifiuti
    show_state: true
    show_icon: true
    show_name: true
    icon: mdi:trash-can-outline
    tap_action:
      action: more-info
    styles: |-
      .bubble-button-card-container {
        border-radius: 20px !important;
      }
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.ZONA_prossimo_secco
        name: Secco
        color: grey
        icon: local:contarina-secco
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_umido
        name: Umido
        color: amber
        icon: local:contarina-umido
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossima_carta
        name: Carta
        color: yellow
        icon: local:contarina-carta
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_vpl
        name: VPL
        color: blue
        icon: local:contarina-vpl
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossimo_vegetale
        name: Vegetale
        color: green
        icon: local:contarina-vegetale
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
      - type: tile
        entity: sensor.ZONA_prossima_raccolta
        name: Prossima raccolta
        color: primary
        state_content:
          - state
          - giorni_mancanti
        tap_action:
          action: more-info
  - type: custom:auto-entities
    card:
      type: entities
      title: Prossime raccolte per frazione
      show_header_toggle: false
    filter:
      include:
        - entity_id: sensor.ZONA_prossimo_secco
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_umido
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossima_carta
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_vpl
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
        - entity_id: sensor.ZONA_prossimo_vegetale
          options:
            type: custom:template-entity-row
            secondary: >-
              {% set g = state_attr(config.entity, 'giorni_mancanti') %}
              {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
              {% elif g is not none %}Tra {{ g }} giorni
              {% else %}—{% endif %}
      exclude: []
    sort:
      method: state
    show_empty: true
  - type: calendar
    entities:
      - calendar.ZONA_calendario_rifiuti
    initial_view: dayGridMonth
  - type: entities
    title: Filtri e aggiornamento
    show_header_toggle: false
    entities:
      - switch.ZONA_filtro_secco
      - switch.ZONA_filtro_umido
      - switch.ZONA_filtro_carta
      - switch.ZONA_filtro_vpl
      - switch.ZONA_filtro_vegetale
      - button.ZONA_aggiorna_calendario
