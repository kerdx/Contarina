# Contarina — dashboard unificata (1 vista Sections, importa e sostituisci ZONA)
#
# COME IMPORTARE (nuova dashboard, consigliato):
#   Impostazioni → Dashboard → Aggiungi dashboard → Vuota → ⋮ → Modifica YAML →
#   cancella tutto, incolla questo file, salva.
# SU DASHBOARD ESISTENTE: copia solo il blocco sotto "views:" (da "- title: Rifiuti"
# in poi) e incollalo come nuova voce della tua lista "views:".
#
# Sostituisci ZONA con lo slug del tuo device, es:
#   sensor.giavera_del_montello_raccolta_rifiuti
#   sensor.giavera_del_montello_prossimo_secco
#   binary_sensor.giavera_del_montello_esporre_stasera
#   calendar.giavera_del_montello_calendario_rifiuti
#   switch.giavera_del_montello_filtro_secco
# Trova e sostituisci "ZONA" in questo file.
#
# HACS richiesti: bubble-card, auto-entities, template-entity-row
# (Niente mushroom: intestazione con Bubble button sullo stesso sensore.)
# Icone local:contarina-* da custom_icons/ in www/custom_icons (vedi custom_icons/README.md).
# Fallback senza custom icons: sostituisci con mdi:trash-can, mdi:food-apple,
# mdi:newspaper, mdi:bottle-soda, mdi:leaf.

views:
  - title: Rifiuti
    path: rifiuti
    type: sections
    badges:
      - type: entity
        entity: binary_sensor.ZONA_esporre_stasera
        name: Esporre stasera
        icon: mdi:delete-alert-outline
        visibility:
          - condition: state
            entity: binary_sensor.ZONA_esporre_stasera
            state: "on"
      - type: entity
        entity: binary_sensor.ZONA_raccolta_oggi
        name: Raccolta oggi
        icon: mdi:trash-can-outline
        visibility:
          - condition: state
            entity: binary_sensor.ZONA_raccolta_oggi
            state: "on"
    sections:
      - cards:
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.ZONA_raccolta_rifiuti
          name: Raccolta rifiuti
          show_state: true
          show_icon: true
          show_name: true
          icon: mdi:trash-can-outline
          tap_action:
            action: more-info
          styles: |-
            .bubble-button-card-container {
              border-radius: 20px !important;
            }

        - type: grid
          columns: 2
          square: false
          cards:
            - type: tile
              entity: sensor.ZONA_prossimo_secco
              name: Secco
              color: grey
              icon: local:contarina-secco
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info
            - type: tile
              entity: sensor.ZONA_prossimo_umido
              name: Umido
              color: amber
              icon: local:contarina-umido
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info
            - type: tile
              entity: sensor.ZONA_prossima_carta
              name: Carta
              color: yellow
              icon: local:contarina-carta
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info
            - type: tile
              entity: sensor.ZONA_prossimo_vpl
              name: VPL
              color: blue
              icon: local:contarina-vpl
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info
            - type: tile
              entity: sensor.ZONA_prossimo_vegetale
              name: Vegetale
              color: green
              icon: local:contarina-vegetale
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info
            - type: tile
              entity: sensor.ZONA_prossima_raccolta
              name: Prossima raccolta
              color: primary
              state_content:
                - state
                - giorni_mancanti
              tap_action:
                action: more-info

        - type: custom:auto-entities
          card:
            type: entities
            title: Prossime raccolte per frazione
            show_header_toggle: false
          filter:
            include:
              - entity_id: sensor.ZONA_prossimo_secco
                options:
                  type: custom:template-entity-row
                  secondary: >-
                    {% set g = state_attr(config.entity, 'giorni_mancanti') %}
                    {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g is not none %}Tra {{ g }} giorni
                    {% else %}—{% endif %}
              - entity_id: sensor.ZONA_prossimo_umido
                options:
                  type: custom:template-entity-row
                  secondary: >-
                    {% set g = state_attr(config.entity, 'giorni_mancanti') %}
                    {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g is not none %}Tra {{ g }} giorni
                    {% else %}—{% endif %}
              - entity_id: sensor.ZONA_prossima_carta
                options:
                  type: custom:template-entity-row
                  secondary: >-
                    {% set g = state_attr(config.entity, 'giorni_mancanti') %}
                    {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g is not none %}Tra {{ g }} giorni
                    {% else %}—{% endif %}
              - entity_id: sensor.ZONA_prossimo_vpl
                options:
                  type: custom:template-entity-row
                  secondary: >-
                    {% set g = state_attr(config.entity, 'giorni_mancanti') %}
                    {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g is not none %}Tra {{ g }} giorni
                    {% else %}—{% endif %}
              - entity_id: sensor.ZONA_prossimo_vegetale
                options:
                  type: custom:template-entity-row
                  secondary: >-
                    {% set g = state_attr(config.entity, 'giorni_mancanti') %}
                    {% if g == 0 %}Oggi — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g == 1 %}Domani — {{ state_attr(config.entity, 'tipi_giorno') }}
                    {% elif g is not none %}Tra {{ g }} giorni
                    {% else %}—{% endif %}
            exclude: []
          sort:
            method: state
          show_empty: true

        - type: calendar
          entities:
            - calendar.ZONA_calendario_rifiuti
          initial_view: dayGridMonth

        - type: entities
          title: Filtri e aggiornamento
          show_header_toggle: false
          entities:
            - switch.ZONA_filtro_secco
            - switch.ZONA_filtro_umido
            - switch.ZONA_filtro_carta
            - switch.ZONA_filtro_vpl
            - switch.ZONA_filtro_vegetale
            - button.ZONA_aggiorna_calendario
